name: Refresh job openings

on:
  schedule:
    - cron: "30 21 * * *" # daily, 03:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-job-openings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch openings from company career feeds
        run: node scripts/fetch-job-openings.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/job-openings.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "korpo-job-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/job-openings.json
          git commit -m "Daily refresh of job openings"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
